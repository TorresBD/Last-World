[package]
name = "last-world-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "last-world"
path = "src/main.rs"

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["std", "multi_threaded"] }
wgpu = "=27.0.1"
winit = { version = "0.30.12", default-features = false, features = ["rwh_06", "x11"] }
bytemuck = { version = "1.24", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
pollster = "0.4"
web-time = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "HtmlElement", "Element", "console", "Storage"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
naga = { version = "=27.0.3", features = ["wgsl-in"] }

[patch.crates-io]
wgpu = { path = "vendor/wgpu" }
